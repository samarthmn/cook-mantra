[project]
name = "cook-mantra-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.0",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.10",
    "langsmith>=0.10.12",
    "Pillow>=12.1.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.22",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["setuptools>=83.0.0,<84"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: opt-in checks that call locally running external services",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
