# Local Cook Mantra model runtime configuration.
# Restart the API after editing; provider discovery is cached for process lifetime.
version: 1
providers:
  codex:
    command: [codex, app-server]
    # Experimental personal-machine preview. See README before enabling.
    allow_unverified_tool_boundary: true
roles:
  ingredient_extractor:
    provider: codex
    model: gpt-5.6-sol
    tuning:
      temperature: 0
      reasoning_effort: none
      timeout_seconds: 300
    editable_instruction: Prefer short, canonical culinary ingredient names.
    capabilities: [vision, structured_output]
  master_chef:
    provider: codex
    model: gpt-5.6-sol
    tuning:
      temperature: 0
      reasoning_effort: none
      timeout_seconds: 300
    editable_instruction: Suggest practical, varied dishes with honest missing ingredients.
    capabilities: [text, structured_output]
  recipe_writer:
    provider: codex
    model: gpt-5.6-sol
    tuning:
      temperature: 0
      reasoning_effort: none
      timeout_seconds: 300
    editable_instruction: Write clear steps with sensory doneness cues.
    capabilities: [text, structured_output]
  image_generator:
    enabled: false
    provider: codex
    model: gpt-5.6-sol
    tuning:
      width: 1024
      height: 1024
      quality: medium
      output_format: webp
      timeout_seconds: 600
    editable_instruction: Create an appetizing cooked-dish illustration.
    capabilities: [image_output]
